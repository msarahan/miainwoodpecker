name: Run Test Suite

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # run tests at 00:00 UTC on day 1 of every month
    - cron: '0 0 1 * *'

# `push` is main only: a `claude/**` branch is worked on through a PR, and
# `pull_request` already covers it. Naming the branch here as well fired every
# workflow twice per push, and the concurrency group below could not collapse
# the pair — the two events carry different `github.ref` values
# (`refs/heads/...` against `refs/pull/N/merge`), so they never share a group.
# The cost of dropping it: a branch pushed before its PR exists gets no CI
# until the PR is opened.
concurrency:
  # Supersede an in-flight run when the same ref is pushed again.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install hatch
      uses: pypa/hatch@install

    - name: Check dependencies
      run: hatch run audit:check

    - name: Test suite
      run: hatch run +py=${{ matrix.python-version }} test:run

    - name: Report coverage
      shell: bash
      run: bash <(curl -s https://codecov.io/bash)

  # The matrix job above installs only the base package, so the device and
  # viewer tests skip themselves there. This job installs those extras and
  # runs the full suite under a virtual display, because napari needs a real
  # GL canvas (QT_QPA_PLATFORM=offscreen is not a valid substitute).
  #
  # Three jobs, each running a third of the suite. As one job it took about
  # 6.5 minutes, against about 4 for the slowest test matrix leg: ~70s of
  # environment build and system libraries, then ~4.6 minutes of tests on
  # the runner's two xdist workers. Each shard pays the ~70s again, so three
  # shards is what brings it in line with the rest, not two.
  #
  # The thirds are by measured *time*, not test count - some 900 unit tests
  # take seconds together, and a few hundred viewer and device tests take
  # the rest - from the committed .test_durations. A test missing from that
  # file is assumed to take the average, so new tests still run; the
  # balance just drifts until the file is refreshed, which is
  # `python scripts/update_test_durations.py junit-*.xml` over the JUnit
  # reports these jobs upload.
  integration:
    name: integration (${{ matrix.group }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
      with:
        python-version: "3.11"

    - name: Install hatch
      uses: pypa/hatch@install

    - name: Install GL and Qt system libraries
      run: bash scripts/install-linux-gui-deps.sh

    - name: Full test suite (device + viewer), share ${{ matrix.group }} of 3, under a virtual display
      run: |
        xvfb-run -a -s "-screen 0 1920x1080x24" \
          hatch run integration:run -n auto \
            --cov=miainwoodpecker --cov-report=term-missing \
            --splits 3 --group ${{ matrix.group }} \
            --splitting-algorithm least_duration \
            --junitxml=junit-${{ matrix.group }}.xml

    # Per-test times, for refreshing .test_durations. JUnit rather than
    # pytest-split's own --store-durations because JUnit's are recorded
    # reliably under xdist.
    - name: Keep the per-test times
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: integration-junit-${{ matrix.group }}
        path: junit-${{ matrix.group }}.xml
        if-no-files-found: ignore

    # The two smoke scripts are seconds long and need no splitting; the
    # first share runs them.
    - name: Phase 0 and Phase 1 device smoke test
      if: matrix.group == 1
      run: hatch run integration:python scripts/phase0_usim_smoke_test.py

    - name: Phase 0 viewer smoke test under a virtual display
      if: matrix.group == 1
      run: |
        xvfb-run -a -s "-screen 0 1920x1080x24" \
          hatch run integration:python scripts/phase0_viewer_smoke_test.py

  # Validate the files this project writes against the official NXem NXDL
  # schema. That check belongs in CI, not the runtime, so pynxtools lives in
  # its own pixi environment and is never a
  # dependency of the shipped package. Its own job rather than a step in the
  # matrix above because it needs no extras, no display, and no OS/Python
  # sweep - the file layout it checks does not vary across them.
  # The script exits non-zero on failure and includes a check that a
  # deliberately non-conforming file is still reported invalid, so this cannot
  # go green on an unvalidated file. (`pynx validate` alone would: the CLI
  # exits 0 even when it prints "is NOT valid".)
  # pixi rather than hatch, and `environments: validate` so the runner
  # installs that one environment rather than the Qt and analysis stacks it
  # has no use for. `frozen: true` for the reason pixi.yml gives: fail rather
  # than re-solve if pixi.lock and the manifest have drifted apart.
  nexus-schema:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up pixi
      uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
      with:
        environments: validate
        frozen: true

    - name: Validate written files against the NXem NXDL schema
      run: pixi run -e validate schema
