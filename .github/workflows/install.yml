# The control-computer installer (scripts/woodpecker.ps1), exercised the
# way a microscope uses it: install a release, install a second, switch,
# roll back - under Windows PowerShell 5.1, which is what those computers
# have, rather than the PowerShell 7 a workflow gets by default.
#
# Both "releases" are this checkout installed under two names with -From,
# so this tests the script and the checkout's ability to be installed
# without git, not GitHub's release API. The second install costs little:
# pixi hard-links it out of the cache the first one filled.
name: Installer

on:
  pull_request:
    paths:
      - 'scripts/woodpecker.ps1'
      - 'pyproject.toml'
      - 'pixi.lock'
      - '.github/workflows/install.yml'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Saved from main only; see test.yml.
env:
  SAVE_CACHES: true

jobs:
  install:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell  # 5.1, deliberately; see above
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # Set here rather than in the job's `env:`, where the `runner`
      # context does not exist - a workflow that says so is rejected
      # before any job starts, and shows up only as a failed run named
      # after its file. Appended without a byte-order mark: 5.1's `>>`
      # writes UTF-16, which the runner cannot read.
      - name: Put the installation somewhere short
        run: |
          [IO.File]::AppendAllText($env:GITHUB_ENV, "WOODPECKER_HOME=$env:RUNNER_TEMP\wph`n")
          # pixi's package cache, which the installer's pinned pixi reads
          # like any other. On D: beside the installation rather than its
          # default under C:\Users: pixi hard-links packages out of the
          # cache into an environment, and a link cannot cross drives - it
          # would copy every file instead.
          [IO.File]::AppendAllText($env:GITHUB_ENV, "PIXI_CACHE_DIR=$env:RUNNER_TEMP\pixi-cache`n")

      # A first install spends most of its time downloading and unpacking
      # conda packages, and those are fixed by pixi.lock - so the cache is
      # keyed on it, and a lockfile change starts from the newest cache
      # rather than from nothing.
      - name: Restore pixi's package cache
        id: pixi-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\pixi-cache
          key: installer-pixi-${{ hashFiles('pixi.lock') }}
          restore-keys: installer-pixi-

      - name: Install a first release
        run: .\scripts\woodpecker.ps1 install 0.0.1 -From .

      - name: Install a second as a canary, and switch to it
        run: .\scripts\woodpecker.ps1 update 0.0.2rc1 -From .

      - name: Roll back
        run: .\scripts\woodpecker.ps1 rollback

      - name: The pointer says what the commands did
        run: |
          .\scripts\woodpecker.ps1 list
          $state = Get-Content -Raw "$env:WOODPECKER_HOME\state.json" | ConvertFrom-Json
          if ($state.current -ne '0.0.1' -or $state.previous -ne '0.0.2rc1') {
            throw "expected current 0.0.1 and previous 0.0.2rc1, got $($state | ConvertTo-Json -Compress)"
          }
          $said = & "$env:WOODPECKER_HOME\bin\pixi.exe" run --frozen `
            --manifest-path "$env:WOODPECKER_HOME\versions\0.0.2rc1\pyproject.toml" -e device `
            python -c "import miainwoodpecker; print(miainwoodpecker.__version__)"
          if ("$said".Trim() -ne '0.0.2rc1') { throw "the 0.0.2rc1 release reports itself as '$said'" }

      - name: Save pixi's package cache
        if: env.SAVE_CACHES == 'true' && steps.pixi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\pixi-cache
          key: ${{ steps.pixi-cache.outputs.cache-primary-key }}
