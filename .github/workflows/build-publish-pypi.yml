name: Build & Publish to PyPI
on:
  release:
    types: [published]
  push:
    branches:
      - main
jobs:
  # setup build separate from publish
  # See https://github.com/pypa/gh-action-pypi-publish/issues/217#issuecomment-1965727093
  build:
    runs-on: ubuntu-latest
    # This ensures that the publish action only runs in the main repository
    # rather than on any forks of your repo. You only should publish from the
    # main repository
    # Environment is encouraged but not required. The build step of this action
    # Only builds your package's sdist and wheel
    environment: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # This fetch element is only important if you are use SCM based
          # versioning (that looks at git tags to gather the version)
          fetch-depth: 100

      # Need the tags so that setuptools-scm can form a valid version number
      - name: Fetch git tags
        run: git fetch origin 'refs/tags/*:refs/tags/*'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.11"
      - name: Install Hatch
        run: |
          pipx install hatch
          pip list

      - name: Build package using Hatch
        run: |
          hatch run build:check
          echo ""
          echo "Generated files:"
          ls -lh dist/
      # Store an artifact of the build to use in the publish step below
      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: python-package-distributions
          path: dist/
  # The publish step will only run on a release from the msarahan repository
  # There are several checks in place including setting up the pypi environment in
  # GitHub so that only people on your maintainer team can allow the deployment
  publish:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    # Off until PyPI trusts this workflow. miainwoodpecker has never been
    # published, so the first upload needs a *pending* trusted publisher
    # on pypi.org (owner msarahan, repository miainwoodpecker, workflow
    # build-publish-pypi.yml, environment pypi); without one, this job
    # fails its OIDC exchange on every release. Register that, then set
    # the repository variable PUBLISH_TO_PYPI to `true` - no code change.
    # Control computers do not need PyPI: the installer builds from the
    # tagged source (docs/installing.md).
    if: >-
      github.repository_owner == 'msarahan' && github.event_name == 'release'
      && vars.PUBLISH_TO_PYPI == 'true'
    needs:
      - build
    runs-on: ubuntu-latest
    # This is the trusted environment. Notice that it's called pypi
    # that is the name that you will use in your pypi configuration
    environment:
      name: pypi
      url: https://pypi.org/p/miainwoodpecker
    permissions:
      id-token: write  # this permission is mandatory for pypi publishing
    steps:
      # Version 4 doesn't support GitHub enterprise yet
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package to PyPI
        # Only publish to real PyPI on release
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # The one-line installer in docs/installing.md downloads
  # releases/latest/download/woodpecker.ps1, so every release must carry
  # the script it was tagged with. "latest" skips pre-releases, which makes
  # a first installation always a stable one; a canary is chosen
  # afterwards, on purpose, with `woodpecker update canary`.
  #
  # This job checks that and cannot fix it. The repository has immutable
  # releases on, so a published release takes no new assets - v0.1.0 was
  # published without the script, this job's upload was refused with a
  # 422, and the one-liner answered 404 until v0.1.1. The script has to be
  # attached *while the release is created*: `gh release create <tag>
  # <file>` makes a draft, uploads, and only then publishes (see "Making a
  # release" in docs/installing.md). What this job adds is noticing, loudly,
  # a release that went out without the script or with a different one
  # than its tag holds.
  check-installer-asset:
    name: Check woodpecker.ps1 is attached
    if: github.repository_owner == 'msarahan' && github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Compare the asset with the tagged script
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! gh release download "$TAG" --pattern woodpecker.ps1 --dir asset; then
            echo "::error::release $TAG has no woodpecker.ps1, so the one-line install cannot find it. A published release is immutable: cut the next one with 'gh release create <tag> <script>' (docs/installing.md)."
            exit 1
          fi
          if ! cmp -s asset/woodpecker.ps1 scripts/woodpecker.ps1; then
            echo "::error::release $TAG carries a woodpecker.ps1 that differs from the one at the tag. Attach 'git show <tag>:scripts/woodpecker.ps1', not a working copy."
            exit 1
          fi
