name: Run linters

on:
  pull_request:
  push:
    branches:
      - main
      - 'claude/**'

# Cancel superseded runs: pushing to a branch with an open PR would otherwise
# trigger both the push and pull_request events.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: '3.11'
      - name: Install hatch
        run: |
          pip install hatch

      - name: Check code style
        run: hatch run style:code

      - name: Check docstrings
        run: hatch run style:docstrings
