################################################################################
# Build Configuration
################################################################################

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

################################################################################
# Project Configuration
################################################################################

[project]
name = "miainwoodpecker"
# You can chose to use dynamic versioning with hatch or static where you add it manually.
dynamic = ["version"]
description = "Instrument control and data analysis for STEM, built as glue over existing open source projects."
authors = [
    { name = "Michael Sarahan" },
]
license = "MIT"
requires-python = ">= 3.11" # Adjust based on the minimum version of Python that you support
readme = {"file" = "README.md", "content-type" = "text/markdown"}
# Please consult https://pypi.org/classifiers/ for a full list.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

keywords = ["microscopy", "stem", "instrument-control", "data-analysis"]

dependencies = [
    "h5py>=3.12",
    "numpy>=2.2.6",
]

[project.scripts]
# Requires the "device" and "viewer" extras.
miainwoodpecker-viewer = "miainwoodpecker.viewer.app:main"
# Requires only the "viewer" extra: the devices it opens against are
# in-process synthetic ones, not a device server. For UI development -
# see src/miainwoodpecker/viewer/preview.py.
miainwoodpecker-preview = "miainwoodpecker.viewer.preview:main"
# Requires the "viewer" and "replay" extras. Opens the viewer against a
# recorded acquisition, replayed at the speed it was taken - see
# src/miainwoodpecker/devices/replay.py.
miainwoodpecker-replay = "miainwoodpecker.devices.replay:main"
# Requires the "device" extra and no display: it serves one instrument to
# however many notebooks, dashboards and viewers connect to it. See
# src/miainwoodpecker/broker/app.py.
miainwoodpecker-broker = "miainwoodpecker.broker.app:main"
# The two above, in the right order, with the second stopped before the
# first: one command for "serve this instrument and open a window on
# it". Needs whatever its two children need and nothing of its own -
# it spawns them and never imports either. See src/miainwoodpecker/launcher.py.
miainwoodpecker-instrument = "miainwoodpecker.launcher:main"

[project.urls]
Homepage = "https://github.com/msarahan/miainwoodpecker"
"Source Code" = "https://github.com/msarahan/miainwoodpecker"
"Bug Tracker" = "https://github.com/msarahan/miainwoodpecker/issues"
Documentation = "https://miainwoodpecker.readthedocs.io"
Download = "https://pypi.org/project/miainwoodpecker/#files"

[project.optional-dependencies]
dev = [
    "pre-commit",
    # Pinned exactly: with ruff's select = ["ALL"], a minor upgrade enables
    # newly added rules and can fail CI with no change of ours. Dependabot
    # bumps this as a reviewable PR.
    "ruff==0.16.2",
]
tests = [
    "pytest>=8.4.2",
]
# Nion's STEM device layer (camera/scan hardware sources) and simulator.
# See docs/migration-plan.md Phase 0/1 - this is kept and reused, not rewritten.
#
# Pinned exactly, transitively (not just nionswift-usim itself): hatch builds
# each env (test/integration/style/...) in its own venv under
# ~/.local/share/hatch, doing its own dependency resolution independent of
# uv.lock - it never consults our lockfile. With a loose ">=" bound, that
# resolution floats freely, and nion's own packages do not hold internal
# APIs like NDataHandler.write_data()'s signature stable across releases:
# CI hit two different missing-required-argument errors for that one
# method from two hatch env builds minutes apart, each resolving a
# different nion-stack release. Exact pins force every resolver - uv.lock
# or hatch's independent one - onto the same versions.
device = [
    "nionswift-usim==5.4.2",
    "nionswift-instrumentation==23.6.2",
    "nionswift==16.16.2",
    "nionswift-io==15.5.0",
    "niondata==15.9.1",
    "nionui==10.2.2",
    "nionutils==4.14.1",
]
# Live-viewer shell candidate. See docs/migration-plan.md section 4 - benchmark
# against ndv before committing further if per-frame overhead is too high.
viewer = [
    "napari[pyside6]>=0.5",
    # For the operator preferences that outlive a session
    # (viewer/preferences.py): which detectors are enabled, and the scan
    # profiles. Declared rather than leaned on transitively - napari
    # already pulls it in, but depending on a dependency's dependency is
    # how an unrelated upgrade removes something out from under you. A
    # loose bound: this uses only user_config_dir, which is the oldest
    # and most stable thing the package offers.
    "platformdirs>=3",
]
# The browser dashboard - notebooks/instrument_dashboard.py - and nothing
# else. marimo is a notebook whose file *is* a Python module: cells are
# functions, the dependency graph is derived from them, and there is no
# .ipynb full of stale outputs to diff. That is why the dashboard is
# built on it rather than on Jupyter, and it is also why this extra is
# small: marimo ships its own server and front end and pulls in no
# scientific stack, so an operator installing it does not acquire a
# second copy of anything the "viewer" or "analysis" extras already
# bring.
# Deliberately *not* a required dependency, and deliberately not implied
# by anything: miainwoodpecker.dashboard - the judgement the app is built
# on, and what the unit suite covers - imports marimo nowhere. A site
# that wants the tiles installs this; a site that does not is unaffected,
# and the tests run either way.
# A loose ">=" bound, for the reason the "analysis" extra gives: one
# package, and the surface used here (mo.md, mo.ui, mo.hstack/vstack,
# mo.Html, mo.stop) is marimo's oldest and most public.
dashboard = [
    "marimo>=0.9",
]
# Phase 4 analysis integration - see docs/migration-plan.md section 5.
# HyperSpy chosen for this extra: it is the lighter, more general option
# and matches the plain scan/camera frame stacks this app produces today
# (no 4D-STEM diffraction-scan mode yet). py4DSTEM and LiberTEM each get
# their own extra below - py4DSTEM because its core object is a true 4D
# datacube this app can't produce yet (see the "py4dstem" extra's adapter
# for what is buildable instead: single-diffraction-pattern operations);
# LiberTEM because it turned out not to need one at all.
# A loose ">=" bound is deliberate here, unlike the "device" extra above:
# HyperSpy is one package (not seven kept in lockstep), its public Signal/AxesManager API
# is the kind of thing a 2.x release is expected to hold stable, and - most
# importantly - the pin is loaded via hatch's own independent per-env
# resolution, so it's exactly the failure mode the "device" comment
# describes, just judged unlikely to bite for this dependency. Revisit
# with an exact pin if a hatch env build ever actually resolves a HyperSpy
# release that breaks this adapter.
# threadpoolctl is here for src/miainwoodpecker/analysis/threads.py, which
# caps the BLAS thread pools underneath an analysis so the GUI thread keeps
# a core (measured: docs/migration-plan.md, Phase 2 - eight competing
# workers froze the viewer for four seconds). It is checked, not assumed,
# to be new weight only here: uv.lock has libertem and py4dstem both
# depending on it directly, and scikit-learn (which both pull in) as well,
# so the other two analysis extras already ship it. Bare "analysis" did
# not - hyperspy's own tree stops at dask/scipy/rosettasciio - and neither
# does napari's. One pure-Python wheel with no dependencies of its own.
# eXSpy joins HyperSpy here rather than getting its own extra, because it
# is not an alternative to HyperSpy - it is where HyperSpy 2.x *moved* the
# EELS and EDS signal classes when it split its domain code out. Measured:
# a bare `hyperspy 2.4` install answers `hs.print_known_signal_types()`
# with an empty table, so `set_signal_type("EDS_TEM")` silently leaves a
# plain Signal1D and `EDSTEMSpectrum` does not exist. Since the whole
# point of this project's spectrum path is that a recording is loadable as
# an EDS signal, an extra that could not do that would be claiming
# something false. It is also cheap next to HyperSpy itself - one package
# plus a couple of pure-Python dependencies against HyperSpy's ~35.
# Replaying a recorded vendor session as a device
# (miainwoodpecker.devices.replay). RosettaSciIO alone, not HyperSpy:
# this reads files and hands the arrays to the device layer, and it has
# no use for a Signal, an AxesManager or a model. That is the whole of
# the difference from the "analysis" extra below, and it is worth a
# separate extra because it is about a factor of thirty in packages -
# rosettasciio's own tree against HyperSpy's dask/scipy/scikit-image
# one - and because replaying a session on a microscope PC should not
# require the analysis stack to be installed on it.
# A loose bound, for the reason the analysis extra gives: this uses
# only file_reader() and the plain dictionary it returns, which is
# RosettaSciIO's most stable and most documented surface.
replay = [
    "rosettasciio>=0.6",
]
analysis = [
    "hyperspy>=2.0",
    "exspy>=0.3",
    "threadpoolctl>=3",
]
# LiberTEM: kept as its own extra, not folded into "analysis" above.
# Measured (docs/migration-plan.md section 5): `pip install libertem` alone
# resolves ~102 packages against a 2-package bare venv baseline - dask,
# distributed, numba, scikit-learn, scikit-image, matplotlib, and a
# Jupyter/ipywidgets stack for its own notebook GUI - roughly 3x HyperSpy's
# ~35. That weight buys high-throughput, tiled, MapReduce-style processing
# for datasets much larger than memory; this app's own acquisition path
# produces plain in-memory frame stacks (Phase 3), so the adapter exercises
# LiberTEM's UDF/DataSet model genuinely, but not the reason most projects
# reach for LiberTEM specifically. A loose ">=" bound for the same reason
# as HyperSpy's above: one package, a stable public Context/DataSet/UDF
# API, and hatch's per-env resolution is the failure mode to watch for, not
# assumed to bite.
libertem = [
    "libertem>=0.16",
]
# Phase 4, follow-up: py4DSTEM specifically - see
# docs/migration-plan.md section 5's Phase 4 notes and
# src/miainwoodpecker/analysis/py4dstem_bridge.py's docstring for why this
# is scoped to single-diffraction-pattern operations, not py4DSTEM's 4D
# DataCube (no synchronized scan-position/camera-frame acquisition mode
# exists, and reaching past the device wrapper into the simulator's own
# probe-position control confirmed that isn't a workaround either - see
# the adapter module for the measurement). Kept as its own extra, not
# folded into "analysis": measured with a fresh `pip install py4dstem`,
# it resolves 65 packages (dask, distributed, scikit-image,
# scikit-learn, scikit-optimize, pylops, mpire, gdown, ...) - heavier
# than HyperSpy's ~35 and close to the ~70 the Phase 3 notes measured for
# pynxtools-em, so a HyperSpy-only install shouldn't pay for it and vice
# versa. Loose ">=" bound for the same reason as the "analysis" extra
# above: one package from this project's point of view, and py4DSTEM's
# public Calibration/DiffractionSlice API is the kind of surface a minor
# release is expected to hold stable.
py4dstem = [
    "py4dstem>=0.14",
]
# Phase 3, storage compression - see docs/migration-plan.md section 5 and
# src/miainwoodpecker/storage/nexus.py's module docstring for the measurements.
# An extra, deliberately not a base dependency, and the reason is
# interoperability rather than weight (hdf5plugin is one wheel of bundled
# codecs, not a 70-package stack): a file written with a blosc2/bitshuffle
# filter cannot be opened *at all* without this plugin present in the
# reading environment, and the readers that matter here are other people's
# - nexusformat, HyperSpy, LiberTEM, py4DSTEM. So NexusWriter's default
# codec is a pure HDF5 built-in (gzip + shuffle), which measured within a
# few percent of blosc2's ratio, and every file this project writes by
# default is readable by a bare h5py. Installing this extra buys the faster
# plugin codecs for someone who has weighed that trade for their own data;
# scripts/nexus_compression_benchmark.py needs it to run the comparison.
compression = [
    "hdf5plugin>=5",
]
# Commodity cameras - USB microscopes, webcams, and replaying a captured
# video file as a fixture - through miainwoodpecker.devices.camera_server.
# Headless because this is a device server: it runs as a subprocess and
# draws nothing, so the GUI build would pull Qt in beside the viewer's own
# and give two toolkits in one process tree for no benefit.
camera = [
    "opencv-python-headless>=4.9",
]
# DECTRIS hybrid-pixel detectors (ARINA, ELA, QUADRO, SINGLA) through
# miainwoodpecker.devices.dectris_server. Deliberately small, because
# SIMPLON needs no vendor library at all: control is HTTP and JSON from
# the standard library, and the *only* thing this buys is decoding the
# monitor images the control unit returns. Those are TIFFs, and a DCU is
# free to send any baseline variant it likes - a compression or byte order
# the module's own narrow reader would have to refuse rather than guess
# at, since guessing wrong silently reinterprets counts. The simulated
# backend writes plain uncompressed strips and needs none of this, which
# is what keeps the whole path runnable in CI.
dectris = [
    "tifffile>=2024.7.24",
]
docs = [
    "sphinx>=8.2.3",
    "myst-parser>=4.0.1",
    "pydata-sphinx-theme~=0.16",
    "sphinx-autobuild>=2024.10.3", # Add to template
    "sphinx-autoapi>=3.6.0", # Add to template
    "sphinx-design>=0.6.1", # Add to template
    "sphinx-copybutton>=0.5.2", # Add to template
]
################################################################################
# Tool Configuration
################################################################################

# Hatch is building your package's wheel and sdist
# This tells hatch to only include Python packages (i.e., folders with __init__.py) in the build.
[tool.hatch.build]
only-packages = true

# This tells Hatch to build the package from the src/miainwoodpecker directory.
[tool.hatch.build.targets.wheel]
packages = ["src/miainwoodpecker"]
[tool.hatch.build.hooks.vcs]
version-file = "src/miainwoodpecker/_version.py"

[tool.hatch.version]
source = "vcs"

######## Configure pytest for your test suite ########
[tool.pytest.ini_options]
testpaths = ["tests"] # Tells pytest what directory tests are in
markers = ["raises"] # Tells pytest to not raise a warning if you use @pytest.mark.raises

[tool.coverage.paths]
source = [
    "src/miainwoodpecker",
    "*/site-packages/miainwoodpecker",
]

[tool.coverage.run]
# Ensures code coverage is measured for branches (conditional statements with different outcomes) in your code.
branch = true
parallel = true
omit = [
    "src/miainwoodpecker/_version.py",
]

[tool.coverage.report]
# This configures the output test coverage report
exclude_lines = ["pragma: no cover"]
precision = 2
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D107",  # 'Missing docstring in __init__' ignored because pydoclint wants us to document the class instead.
    "D203",  # '1 blank line required before class docstring' ignored because we want no blank line.
    "D212",  # 'Multi-line docstring summary should start at the first line' ignored because we want the summary to start on the second line.
    "D407",  # 'Missing dashed underline after section' ignored because Google style docstrings don't underline.
    "D413",  # 'Missing blank line after section' ignored .
    "D401",  # 'First line should be in imperative mood' ignored
    "ANN001",  # Missing type annotation for {arg} in function" ignored
    "ANN201",  # 'Missing type annotation for {return}'.
    "COM812",  # 'Missing trailing comma in collection' ignored to comply with black formatting.
    "CPY001",  # 'Missing copyright notice at top of file'. The project's MIT
               # license is declared once in LICENSE and pyproject.toml; per-file
               # notices are redundant for it. The one exception,
               # devices/nion_server.py, is GPL-3.0 (it imports Nion's GPL-3.0
               # device stack directly - see docs/migration-plan.md section 6)
               # and states that in its own module docstring instead of a
               # ruff-style copyright stamp.
]
exclude = [
    "src/miainwoodpecker/_version.py",
    "docs/conf.py",
]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = [
    "E401",  # 'Multiple imports on one line'
    "E402",  # 'Module level import not at top of file'
    "F401",  # 'Imported but unused'
    "I001",  # 'Import block is un-sorted or un-formatted' ignored because we may have to import in a particular, not-alphabetical order.
]
"tests/**/*.py" = [
    "S101",  # 'Use of assert detected' ignored because we are using pytest.
    "INP001",  # 'Insecure input' ignored because we are testing.
    "ANN201",  # 'Missing type annotation for {return}' ignored because all tests return `None`.
    "E402",  # imports after pytest.importorskip in integration tests.
]
"scripts/**/*.py" = [
    "INP001",  # standalone entry-point scripts, not a package.
    "T201",  # these are diagnostic CLI scripts; print is the interface.
]
"src/miainwoodpecker/viewer/documents.py" = [
    # Reparenting a napari viewer into an MDI sub-window needs the Qt
    # widget behind it, and napari.Viewer.window exposes it only as
    # _qt_window. There is no public accessor - the alternative is not a
    # tidier one, it is giving up per-document zoom and napari's own
    # layer controls (see the module docstring). Confined to this file,
    # each such call wrapped so a napari upgrade that renames them
    # degrades the chrome rather than failing to open a window.
    "SLF001",  # 'Private member accessed'
]
"notebooks/**/*.py" = [
    # A marimo notebook IS a Python module, which is what makes it
    # diffable and lintable at all - but its shape is marimo's, not
    # ours, and marimo rewrites the parts below every time the file is
    # saved from the editor. Fighting it here would mean a file that
    # fails CI the first time an operator edits the notebook in the tool
    # it exists to be edited in. Everything with a *decision* in it
    # lives in src/miainwoodpecker/dashboard, which is linted normally.
    "INP001",   # an app, deliberately not an importable package
    "ANN202",   # cell signatures are generated; marimo owns them
    "N803",     # a cell's parameters are the names it consumes, so an
                # imported class arrives under the class's own name
    "PLR0913",  # ditto: the acquire cell consumes a dozen controls, and
    "PLR0917",  # that list is its dependency graph, not an argument list
    "PLC0415",  # imports live in a cell so the graph knows what depends
                # on them - a module-level import would belong to no cell
    "B018",     # a bare expression is a cell's *output*. This is the
                # whole display mechanism, not a forgotten statement
    "PLR1711",  # the trailing `return` is marimo's serialization of
                # which names a cell exports
]
"src/miainwoodpecker/viewer/panels/*.py" = [
    # These modules ARE LiveInstrumentWidget's construction code; they
    # were methods on it until live.py passed 1900 lines. Building a
    # widget's own children and binding them to its own attributes is
    # not reaching into someone else's private state, and the
    # alternative - making every control public purely to satisfy the
    # rule - would widen the class's surface to describe a file split.
    "SLF001",  # 'Private member accessed'
]

[tool.ruff.lint.isort]
case-sensitive = true
known-first-party = ["src", "miainwoodpecker"]

[tool.pydoclint]
style = "numpy"
arg-type-hints-in-signature = true
arg-type-hints-in-docstring = true
check-return-types = false
check-yield-types = false
exclude = "_version.py"


# Use UV to create Hatch environments
[tool.hatch.envs.default]
installer = "uv"

################################################################################
# Hatch Environments
################################################################################

#--------------- Build and check your package ---------------#

# This table installs the tools you need to test and build your package
# `builder = true` needed since hatch 1.16: https://github.com/pypa/hatch/issues/2113
[tool.hatch.envs.build]
description = """Test the installation the package."""
dependencies = [
    "pip",
    "twine",
]
detached = true
builder = true

# This table installs created the command hatch run install:check which will build and check your package.
[tool.hatch.envs.build.scripts]
check = [
    "pip check",
    "hatch build {args:--clean}",
    "twine check dist/*",
]

#--------------- Run tests ---------------#

[tool.hatch.envs.test]
description = """Run the test suite."""
extra-dependencies = [
    "pytest",
    "pytest-cov",
    "pytest-raises",
    "pytest-randomly",
    "pytest-xdist",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.11", "3.12", "3.13"]

# Deliberately serial. This env installs only the base package, so it
# runs the unit suite - 206 tests in ~3.4s - and xdist made that
# *slower* (4.0s), because spinning up workers costs more than the
# tests take. Parallelism is enabled where it was measured to pay: the
# integration env below.
[tool.hatch.envs.test.scripts]
run = "pytest {args:--cov=miainwoodpecker --cov-report=term-missing}"

#--------------- Run the full suite, including devices, viewer, and analysis ---------------#

# The default "test" env installs only the base package, so device, viewer,
# and analysis tests skip themselves. This env installs those extras so they
# actually run.
# Viewer tests need a real GL canvas: on Linux, run this under a virtual
# display and install the system libraries first, e.g.
#   bash scripts/install-linux-gui-deps.sh
#   xvfb-run -a -s "-screen 0 1920x1080x24" hatch run integration:run
[tool.hatch.envs.integration]
description = """Run the full test suite, including device, viewer, and analysis tests."""
features = [
    "analysis",
    # OpenCV, so the commodity-camera server's hardware backend is
    # covered here rather than only where someone has a webcam: it opens
    # a generated video file through the same VideoCapture path a USB
    # microscope uses. The base "test" env deliberately lacks it, which
    # is what the simulated backend exists for.
    "camera",
    "compression",
    "device",
    "libertem",
    "py4dstem",
    "tests",
    "viewer",
]
extra-dependencies = [
    "pytest-cov",
    # Not inherited from the "test" env; this env does its own resolution.
    "pytest-xdist",
]

# One worker per core, and the worker count had to be measured against
# the *whole* command rather than the tests alone. Without coverage this
# suite is dominated by waiting on device-server subprocesses and napari,
# so oversubscribing pays (-n 8 beat -n 4, 56s to 86s). Coverage
# instrumentation makes it CPU-bound instead, and the ordering inverts:
# on these 4 cores, serial 140s, -n 4 52s, -n 8 132s - barely better than
# serial, because eight CPU-bound workers thrash four cores. `auto` is
# therefore right for the reason rather than by luck: it tracks the
# runner's core count, which is what the bound actually is here.
[tool.hatch.envs.integration.scripts]
run = "pytest {args:-n auto --cov=miainwoodpecker --cov-report=term-missing}"

#--------------- Validate written files against the NeXus schema ---------------#

# docs/migration-plan.md section 5, Phase 3: validating our output against the
# official NXem NXDL belongs in CI, not the runtime. pynxtools is a ~90-package
# stack that ships the NXDL definitions inside the wheel, so the check runs
# fully offline (the NeXus/FAIRmat spec sites are unreachable here) - but it
# gets its own env so nothing in that stack can reach the shipped package or
# the other test environments.
# Loose ">=" bound: this env's only job is to fail when our files stop
# validating, and a pynxtools upgrade tightening the schema is a signal worth
# receiving rather than pinning away.
[tool.hatch.envs.validate]
description = """Validate written NeXus files against the NXem NXDL schema."""
# Python is pinned rather than left to hatch's own default. CI's job sets up
# 3.11, but hatch resolves each env's interpreter independently of the job's
# setup-python step, and picked 3.12 on the runner - which is how this env
# passed locally and failed in CI.
python = "3.11"
# Deliberately plain "pynxtools", not "pynxtools[em]". The NXDL definitions
# (including NXem) ship inside the base wheel, which is what makes offline
# validation possible at all; the [em] extra adds the vendor-format reader
# stack - pynxtools-em -> kikuchipy -> numba 0.53.1 -> llvmlite 0.36.0 - which
# is both the ~70-package dependency the Phase 3 notes explicitly avoided and
# unbuildable on Python 3.12 (llvmlite 0.36 supports <3.10 only). Nothing here
# converts vendor formats; this env only checks a file we wrote against a
# schema.
extra-dependencies = [
    "pynxtools>=0.15",
]

[tool.hatch.envs.validate.scripts]
schema = "python scripts/validate_nexus_schema.py"

#--------------- Build and preview your documentation ---------------#

# This sets up a hatch environment with associated dependencies that need to be installed
[tool.hatch.envs.docs]
description = """Build or serve the documentation."""
python = "3.11"
# Install optional dependency test for docs
features = [
    "docs",
]

# This table contains the scripts that you can use to build and serve your docs
# hatch run docs:build will build your documentation
# hatch run docs:serve will serve them 'live' on your computer locally
[tool.hatch.envs.docs.scripts]
build = ["sphinx-build {args:-W -b html docs docs/_build}"]
serve = ["sphinx-autobuild docs --watch src/miainwoodpecker {args:-b html docs/_build/serve}"]

#--------------- Format & style your code ---------------#

[tool.hatch.envs.style]
description = """Check the style of the codebase."""
dependencies = [
    "pydoclint",
    # Keep in step with the pin in the "dev" extra above.
    "ruff==0.16.2",
]
detached = true

[tool.hatch.envs.style.scripts]
docstrings = "pydoclint src/ tests/"
code = "ruff check {args}"
format = "ruff format {args}"
check = ["docstrings", "code"]

#--------------- Check security for your dependencies ---------------#

[tool.hatch.envs.audit]
description = """Check dependencies for security vulnerabilities."""
extra-dependencies = [
    "pip-audit",
]

[tool.hatch.envs.audit.scripts]
check = ["pip-audit"]

################################################################################
# Pixi: the cross-platform install path, and the one that works on Windows
################################################################################
#
# Why this exists next to the hatch environments above
# -----------------------------------------------------
# The hatch envs are the *maintainer's* tooling: they build wheels, run the
# matrix, and are what CI drives. Pixi is the **installer's** path — one
# command from a fresh clone to a running application, on the operating
# system the microscopes actually run.
#
# That is not a preference, it is the reason: this project's viewer needs Qt
# and a GL canvas, its storage needs HDF5, and its analysis extras need the
# scientific stack. On Windows those are exactly the packages where pip
# wheels are least reliable and conda-forge builds are most. A microscope
# PC is also the machine where "it failed to build a wheel" is least
# welcome — there is often no compiler on it, and no appetite for
# installing one.
#
# Pixi also locks. `pixi.lock` is committed and covers every platform listed
# below, so a colleague on a different machine resolves nothing: they get
# the versions this was tested against. That is the same reason the
# "device" extra is pinned exactly (see its comment above), reached by a
# mechanism instead of by discipline.
#
# Getting started:
#     pixi run preview          # the synthetic instrument, no hardware
#     pixi run test             # the unit suite
#     pixi run -e device viewer # against the nionswift-usim simulator
#
# `pixi run` installs what it needs first, so none of these needs a
# separate install step.

[tool.pixi.workspace]
channels = ["conda-forge"]
# win-64 first, deliberately: it is the platform this has to work on.
# linux-64 is CI and most contributors; osx-arm64 is the rest of them.
# Adding a platform costs a re-lock (`pixi lock`) and nothing else.
platforms = ["win-64", "linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.14"
# From conda-forge rather than left to the pypi resolver: both are
# compiled, and h5py's HDF5 library is the single most common source of
# "installed fine, crashes on import" on Windows. Their versions still
# come from [project.dependencies] - these bounds only say *where* the
# build comes from, and pixi checks the two agree.
h5py = ">=3.12"
numpy = ">=2.2.6"

# The project itself, editable, so `pixi run` picks up an edit without a
# reinstall. Pixi adds this automatically for a pyproject manifest; it is
# written out because every feature below overrides it to name its extras,
# and a default that was invisible next to four explicit ones would be the
# one nobody could find.
[tool.pixi.pypi-dependencies]
miainwoodpecker = { path = ".", editable = true }

#--------------- Features: one per extra, plus the tooling ---------------#

# Each feature installs the matching extra from [project.optional-dependencies]
# rather than restating its contents, so there is one list of what the
# viewer needs and pixi cannot drift from it. What the features *do* add is
# conda builds of the compiled packages underneath those extras: pixi
# satisfies a pypi requirement with a conda package of the same name, so
# naming `pyside6` here means the extra's `napari[pyside6]` is met by
# conda-forge's build instead of a wheel.

[tool.pixi.feature.viewer.dependencies]
# Qt is the reason this whole table exists. conda-forge's pyside6 brings
# its own Qt libraries; the PyPI wheel brings Qt too but is far more
# likely to disagree with what is already on a Windows box.
pyside6 = "*"
napari = ">=0.5"
platformdirs = ">=3"

[tool.pixi.feature.viewer.pypi-dependencies]
miainwoodpecker = { path = ".", editable = true, extras = ["viewer"] }

# Nion's device stack, and **its own environment on purpose**. It is
# GPL-3.0, and this project never imports it into its own process (see the
# licensing note in README.md): it runs as a subprocess, launched via
# `python -m miainwoodpecker.devices.nion_server`. Keeping it in a separate
# pixi environment makes that boundary something you can see in the
# manifest rather than only in a docstring - the default environment does
# not contain it, so the shipped application demonstrably runs without it.
[tool.pixi.feature.device.pypi-dependencies]
miainwoodpecker = { path = ".", editable = true, extras = ["device"] }

[tool.pixi.feature.dashboard.pypi-dependencies]
# marimo from PyPI rather than conda-forge, and no conda dependencies
# table beside it: it is pure Python with its own bundled front end, so
# there is nothing compiled underneath for a conda build to make safer -
# which is the only reason the features above name one.
miainwoodpecker = { path = ".", editable = true, extras = ["dashboard"] }

[tool.pixi.feature.replay.dependencies]
# conda-forge's build, so the compiled readers underneath RosettaSciIO
# (and the HDF5 it shares with h5py) come from one place rather than
# from a wheel that brought its own.
rosettasciio = ">=0.6"

[tool.pixi.feature.replay.pypi-dependencies]
miainwoodpecker = { path = ".", editable = true, extras = ["replay"] }

[tool.pixi.feature.analysis.dependencies]
# HyperSpy's tree is dask, scipy and scikit-image; conda-forge builds all
# three, and this is the extra most likely to want a compiler otherwise.
hyperspy = ">=2.0"
exspy = ">=0.3"
threadpoolctl = ">=3"

[tool.pixi.feature.analysis.pypi-dependencies]
miainwoodpecker = { path = ".", editable = true, extras = ["analysis"] }

[tool.pixi.feature.test.dependencies]
pytest = ">=8.4.2"
pytest-cov = "*"
pytest-randomly = "*"

# Detached from the project on purpose: a style check that had to solve the
# viewer's Qt stack first would be the slowest fast feedback available.
[tool.pixi.feature.style.dependencies]
# Keep in step with the pin in the "dev" extra and the hatch style env.
ruff = "==0.16.2"
pydoclint = "*"
pre-commit = "*"

#--------------- Environments ---------------#
#
# `solve-group` is what keeps these consistent: every environment in the
# "main" group is solved together, so the numpy in `default` is the numpy
# in `analysis` and a result computed in one is reproducible in the other.
# `style` sits outside it, having nothing to be consistent with.

[tool.pixi.environments]
# What a new arrival gets, and it is deliberately the one that needs no
# hardware and no vendor SDK: the viewer, the synthetic instrument, and
# the tests.
default = { features = ["viewer", "test"], solve-group = "main" }
# Its own environment, like device and analysis below, rather than part
# of the default. Replaying a recorded session is something you set out
# to do, and the file reader it needs has no business in the environment
# someone gets for opening the synthetic instrument - which is also the
# environment the viewer's own tests run in, and the fewer packages
# underneath those the better.
replay = { features = ["viewer", "replay", "test"], solve-group = "main" }
device = { features = ["viewer", "device", "test"], solve-group = "main" }
analysis = { features = ["viewer", "analysis", "test"], solve-group = "main" }
# The browser dashboard, and no viewer: it is the front end for people who
# are *not* opening the Qt window, so pulling Qt in behind it would defeat
# the point. It does need the device feature, because a dashboard with no
# broker to connect to has nothing to show - and `pixi run -e dashboard`
# is then one environment that can both serve an instrument and watch it.
dashboard = { features = ["dashboard", "device", "test"], solve-group = "main" }
all = { features = ["viewer", "device", "analysis", "replay", "dashboard", "test"], solve-group = "main" }
style = { features = ["style"], no-default-feature = true }

#--------------- Tasks ---------------#

[tool.pixi.tasks]
# The demonstration that needs nothing: a synthetic STEM with a scan unit,
# a Ronchigram camera and an EEL spectrometer. See docs/developing-the-ui.md.
preview = { cmd = "miainwoodpecker-preview --cameras 2", description = "Open the viewer against the synthetic instrument" }
# The whole arrangement in one command: a broker over the instrument in
# the environment that has the vendor stack, and the window on it in the
# environment that does not - which is what makes "the application runs
# without Nion installed" something you can watch happen rather than
# something the manifest asserts. The launcher itself runs here, in the
# default environment, and re-enters pixi for each child; see
# src/miainwoodpecker/launcher.py.
instrument = { cmd = "miainwoodpecker-instrument --broker-env device --ui-env default", description = "Serve the instrument and open a window on it" }
# The same instrument, with the browser dashboard as the front end
# instead of the Qt window - in the environment that has marimo and no
# Qt, which is the whole reason that environment exists. Add --publish
# to a path of your own if a notebook should join this one too.
dashboard = { cmd = "miainwoodpecker-instrument --broker-env device --ui-env dashboard --publish . -- marimo run notebooks/instrument_dashboard.py", description = "Serve the instrument and open the browser dashboard on it" }
# No front end at all: hold the microscope open and let people attach and
# detach - a window now, a notebook later, both at once - until Ctrl-C.
# Publishes into the working directory, which is where a notebook looks
# when it is told nothing else.
serve = { cmd = "miainwoodpecker-instrument --serve --publish . --broker-env device", description = "Hold the instrument open for clients to come and go" }
# Unit tests only. They need no display and no devices, which is what makes
# them the default: a check that cannot run on the machine in front of you
# is not a check.
test = { cmd = "pytest tests/unit", description = "Run the unit suite" }
test-all = { cmd = "pytest", description = "Run every test, including those needing a display" }

[tool.pixi.feature.replay.tasks]
# Takes a session directory:
#   pixi run -e replay replay /path/to/session --list
# says what is in one, and without --list it opens the viewer against
# an acquisition and replays it at the speed it was recorded.
replay = { cmd = "miainwoodpecker-replay", description = "Replay a recorded acquisition through the viewer" }

[tool.pixi.feature.device.tasks]
viewer = { cmd = "miainwoodpecker-viewer", description = "Open the viewer against the nionswift-usim simulator" }

[tool.pixi.feature.style.tasks]
lint = { cmd = "ruff check", description = "Check the code style" }
format = { cmd = "ruff format", description = "Reformat the code" }
docstrings = { cmd = "pydoclint src/ tests/", description = "Check the docstrings" }
